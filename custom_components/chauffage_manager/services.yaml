set_control:
  fields:
    target:
      required: true
      example: "Bureau"
      selector:
        text:
    control:
      required: true
      selector:
        select:
          options: [auto, manual]
set_manual:
  fields:
    target:
      required: true
      example: "Salon"
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options: [off, frost_protection, eco, comfort_minus_2, comfort_minus_1, comfort]
    temperature:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
